[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geometry-of-alignment"
version = "0.1.0"
description = "Geometry of alignment: subspace interventions for safety-preserving fine-tuning."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "torch",
    "transformers",
    "accelerate",
    "datasets",
    "trl",
    "peft",
    "hydra-core>=1.3",
    "hydra-submitit-launcher",
    "omegaconf>=2.3",
    "numpy",
    "tqdm",
    "tensorboard",
]

[project.urls]
Repository = "https://github.com/princeton-peas-lab/geometry-of-alignment"
Paper = "https://arxiv.org/abs/2602.15799"

[project.optional-dependencies]
# Generative eval + offline safety generation/labeling.
vllm = ["vllm"]
# Generation / WildGuard labelling through an OpenAI-compatible server (backend=api).
api = ["openai"]
dev = ["pytest>=8", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: disk-backed dataset loading, GPU, or vLLM (needs data files / hardware)",
]

[tool.ruff]
line-length = 100
src = ["src", "cli", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
