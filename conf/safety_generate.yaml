# Safety response generation (api | offline_vllm backend).
defaults:
  - _self_
  - dataset: advbench
  - model: llama32-3b-instruct

backend: offline_vllm  # api | offline_vllm

io:
  output_file: results/safety_eval/generated_responses.json

api:
  api_base: http://localhost:8000/v1
  api_key: EMPTY

sampling:
  temperature: 0.0
  top_p: 1.0
  max_tokens: 2048

vllm:
  tensor_parallel_size: 1
  gpu_memory_utilization: 0.9
  max_model_len: null
  additional_config: null

runtime:
  timeout: 120.0
  limit: null
